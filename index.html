  <script>
  (function () {
    const footer = document.getElementById('rodape-site');
    const faixa = document.getElementById('rodape-faixa');
    const handle = document.getElementById('rodape-arrastar');
    const seta = document.getElementById('rodape-seta');
    const painel = document.getElementById('rodape-painel');
    const tabs = { suporte: document.getElementById('aba-suporte'), bancas: document.getElementById('aba-bancas') };
    const contents = { suporte: document.getElementById('painel-suporte'), bancas: document.getElementById('painel-bancas') };
    let atual = null;
    function mudar(tipo) {
      atual = atual === tipo ? null : tipo;
      footer.classList.toggle('aberto', !!atual);
      painel.setAttribute('aria-hidden', String(!atual));
      handle.setAttribute('aria-expanded', String(!!atual));
      seta.textContent = atual ? '⌄' : '⌃';
      for (const chave of Object.keys(tabs)) {
        tabs[chave].setAttribute('aria-expanded', String(atual === chave));
        contents[chave].hidden = atual !== chave;
      }
    }
    tabs.suporte.addEventListener('click', () => mudar('suporte'));
    tabs.bancas.addEventListener('click', () => mudar('bancas'));
    handle.addEventListener('click', () => mudar(atual || 'suporte'));
    let inicio = null;
    faixa.addEventListener('touchstart', e => { inicio = e.touches[0].clientY; }, {passive: true});
    faixa.addEventListener('touchend', e => {
      if (inicio === null) return;
      const delta = e.changedTouches[0].clientY - inicio;
      if (delta < -20 && !atual) mudar('suporte');
      if (delta > 20 && atual) mudar(atual);
      inicio = null;
    }, {passive: true});
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && atual) mudar(atual); });
  })();
  </script>
